<style>
.eval-embed{position:fixed;top:0;left:0;width:100vw;height:100vh;border:0;z-index:9999;background:var(--bg)}
.eval-overlay{position:fixed;inset:0;z-index:9998;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.eval-overlay .brand{font-size:22px;font-weight:700;letter-spacing:-.02em}
.eval-overlay .sub{color:var(--muted);font-size:14px;max-width:480px;text-align:center;line-height:1.6}
.eval-overlay . feats{display:flex;gap:20px;margin:10px 0}
.eval-overlay .feat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.eval-overlay .feat svg{width:15px;height:15px;color:var(--pass)}
</style>
<!-- EvalDeck 全量评测平台：iframe 嵌入，全能力可用 -->
<div class="eval-overlay" id="evalLoading">
  <div class="brand">Agent 评测平台</div>
  <div class="sub">11 个预置评估器 · 轨迹断言 DSL · 实验门禁 · 成本中心 · stale 传播</div>
  <div class="feats">
    <div class="feat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg>Agent-as-a-Judge</div>
    <div class="feat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg>DSL 七算子</div>
    <div class="feat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg>实验门禁</div>
    <div class="feat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg>成本可见</div>
  </div>
  <div class="faint" style="font-size:12px">正在加载评测平台…</div>
</div>
<iframe class="eval-embed" src="{{EVALDECK_URL}}"
        onload="document.getElementById('evalLoading').style.display='none'"
        title="Agent 评测平台" allow="clipboard-write"></iframe>
